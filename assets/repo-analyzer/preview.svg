    <g transform="translate(1000 685)"><rect x="-72" y="-34" width="144" height="68" rx="14" fill="#271631" stroke="#EC4899"/><text y="6" fill="#FFF0F8" font-size="16">Hybrid search</text></g>
    <g transform="translate(1208 685)"><rect x="-66" y="-34" width="132" height="68" rx="14" fill="#112D2A" stroke="#39FF88"/><text y="6" fill="#E9FFF2" font-size="16">Grounded AI</text></g>
  </g>
