    <rect x="1048" y="418" width="362" height="122" rx="20" fill="#0B1124" stroke="#2C3859"/><text x="1076" y="453" fill="#7988AA" font-size="13" letter-spacing="2">CITATION COVERAGE</text><text x="1076" y="510" fill="#F7F9FF" font-size="36" font-weight="750">96.8%</text><path d="M1270 504l28-26 22 15 48-44" fill="none" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect x="330" y="574" width="1080" height="290" rx="20" fill="#090E20" stroke="#2C3859"/><text x="360" y="616" fill="#7988AA" font-family="Inter,Arial" font-size="13" letter-spacing="2">RETRIEVAL PIPELINE</text>
  <g font-family="Inter,Arial" text-anchor="middle">
    <g transform="translate(414 685)"><rect x="-58" y="-34" width="116" height="68" rx="14" fill="#11263A" stroke="#00E5FF"/><text y="6" fill="#E9FBFF" font-size="16">Repository</text></g>
    <g transform="translate(606 685)"><rect x="-58" y="-34" width="116" height="68" rx="14" fill="#171D39" stroke="#4C7CFF"/><text y="6" fill="#EEF2FF" font-size="16">Indexer</text></g>
