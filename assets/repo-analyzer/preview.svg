  <g fill="#9AA8C7" font-family="ui-monospace,Consolas" font-size="14"><text x="83" y="254">▾ api</text><text x="103" y="286">routes.py</text><text x="103" y="318">schemas.py</text><text x="83" y="358">▾ retrieval</text><text x="103" y="390">hybrid.py</text><text x="103" y="422">reranker.py</text><text x="83" y="462">▸ indexing</text><text x="83" y="502">▸ dashboard</text><text x="68" y="542">README.md</text></g>
  <line x1="50" y1="588" x2="270" y2="588" stroke="#25304D"/><text x="58" y="628" fill="#7886A8" font-family="Inter,Arial" font-size="13" letter-spacing="2">INDEX STATUS</text>
  <circle cx="67" cy="664" r="6" fill="#39FF88" filter="url(#glow)"/><text x="84" y="670" fill="#D9E2FF" font-family="Inter,Arial" font-size="15">Ready · 1,284 files</text>
  <rect x="58" y="700" width="204" height="8" rx="4" fill="#1C2742"/><rect x="58" y="700" width="190" height="8" rx="4" fill="url(#a)"/>
  <text x="330" y="140" fill="#8290AF" font-family="Inter,Arial" font-size="14" letter-spacing="2">REPOSITORY INTELLIGENCE</text>
  <text x="330" y="196" fill="#F7F9FF" font-family="Inter,Arial" font-size="40" font-weight="750">Understand the system.</text>
  <text x="330" y="238" fill="#9BA8C7" font-family="Inter,Arial" font-size="20">Ground every answer in the code that produced it.</text>
  <rect x="330" y="278" width="690" height="262" rx="20" fill="#0B1124" stroke="#2C3859"/>
  <text x="360" y="318" fill="#68789D" font-family="Inter,Arial" font-size="13" letter-spacing="2">ASK THE REPOSITORY</text>
  <text x="360" y="367" fill="#F2F5FF" font-family="Inter,Arial" font-size="20" font-weight="600">How does the hybrid retrieval pipeline rank results?</text>
  <line x1="360" y1="392" x2="990" y2="392" stroke="#26304B"/>
  <text x="360" y="428" fill="#B8C3DF" font-family="Inter,Arial" font-size="16">The pipeline combines BM25 lexical scores with vector similarity,</text><text x="360" y="456" fill="#B8C3DF" font-family="Inter,Arial" font-size="16">normalizes both result sets, then reranks the merged candidates.</text>
  <rect x="360" y="482" width="244" height="34" rx="9" fill="#112A35" stroke="#00E5FF" stroke-opacity=".45"/><text x="378" y="504" fill="#69EEFF" font-family="ui-monospace,Consolas" font-size="13">retrieval/hybrid.py:42</text>
